name: Unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest pytest-asyncio voluptuous
      - run: python -m pytest -p pytest_asyncio.plugin -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
